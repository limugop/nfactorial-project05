[project]
name = "spasti-khakaton"
version = "0.1.0"
description = "Раздатка модульного проекта «Спасти хакатон»: управляемый агент, MCP, состояние, идемпотентность и защита от инъекций"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.24.0",
    "mcp>=1.19.0,<2",
    "pydantic>=2.10.0",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
